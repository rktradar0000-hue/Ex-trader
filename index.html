<!DOCTYPE html>
<html>
<head>
  <title>EX TRADER REAL SIGNAL</title>
  <style>
    body{
      background:#0f172a;
      color:white;
      text-align:center;
      font-family:Arial;
      margin-top:40px;
    }
    button{
      padding:12px 20px;
      background:limegreen;
      border:none;
      color:white;
      font-size:16px;
      cursor:pointer;
    }
    #box{
      margin-top:30px;
      background:#1e293b;
      padding:20px;
      border-radius:10px;
      display:inline-block;
      font-size:20px;
    }
  </style>
</head>
<body>

<h2>EX TRADER REAL SIGNAL BOT</h2>

<select id="pair">
  <option value="EURUSD">EURUSD</option>
  <option value="GBPUSD">GBPUSD</option>
  <option value="EURJPY">EURJPY</option>
  <option value="EURCAD">EURCAD</option>
  <option value="USDCAD">USDCAD</option>
  <option value="CADJPY">CADJPY</option></option>
  <option value="USDTRY OTC">USDTRY OTC</option>
  <option value="USDINR OTC">USDINR OTC</option>
  <option value="USDBRL OTC">USDBRL OTC</option>
  <option value="BTC OTC ">BTC OTC</option>
  <option value="EURUSD OTC">EURUSD OTC</option>
  
</select>

<br><br>

<button onclick="getSignal()">Start Analysis</button>

<div id="box"></div>

<script>
async function getSignal(){

  let pair = document.getElementById("pair").value;

  // Demo Logic (simple moving idea)
  let random = Math.random();

  let signal = random > 0.5 ? "CALL ⬆️" : "PUT ⬇️";

  let time = new Date().toLocaleTimeString();

  document.getElementById("box").innerHTML =
    pair + "<br>" +
    "Signal: " + signal + "<br>" +
    "Time: " + time + "<br>" +
    "Expiry: 1 Minute";
}
</script>

</body>
</html>
